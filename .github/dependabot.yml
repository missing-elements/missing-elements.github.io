version: 2
updates:
  # The docs run the pdfjs-viewer version they describe, and /h5p/ serves the H5P packages it
  # builds with, so their releases arrive as their own PRs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      tooling:
        patterns: ["*"]
        exclude-patterns: ["@missing-elements/*"]
    # New versions wait three days, but ours are taken the day they are released: they are what
    # these pages run. pnpm-workspace.yaml leaves them out of pnpm's age check to match (#9).
    cooldown:
      default-days: 3
      exclude: ["@missing-elements/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
